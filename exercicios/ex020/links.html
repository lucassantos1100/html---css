<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

    /* SELETORES PERSONALIZADOS
        # = id
        . = class
        :pseudo-class
        ::pseudo-element
        > children
    */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
             text-decoration: none;
             font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: rgb(240, 138, 138);
        }
        .especial::before {
            content: '⇨' ;
            
        }
        .especial::after {
            content: '⇦';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        
    </style>
</head>
<body>
   <h1>Personalizado Links</h1> 
   <ul>
    <li><a href="https://github.com/lucascraft1100-del">Repositório GitHub</a></li>
    <li><a href="https://www.youtube.com/@zLucas_20" class="especial">Canal do Youtube</a></li>
    <li><a href="https://www.CursoemVideo.com" class="especial">Site do CursoemVideo</a></li>
   </ul>
</body>
</html>
